<!doctype html>
<html lang="it">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Indovina Chi - Lobby</title>
    <link href="https://fonts.googleapis.com/css2?family=Bungee&family=Barlow:wght@400;600;700&display=swap" rel="stylesheet">
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN"
        crossorigin="anonymous"
    />
    <link rel="stylesheet" href="stile.css" />
</head>
<body class="lobby-page">
    <main class="container py-4 py-md-5">
        <div class="d-flex flex-wrap align-items-center justify-content-between mb-4 gap-3">
            <div>
                <h1 class="title-font mb-1">Indovina Chi</h1>
                <p class="mb-0">Scegli una partita libera o crea una stanza pubblica/privata.</p>
            </div>
            <button id="refreshBtn" class="btn btn-outline-dark">Aggiorna partite</button>
        </div>

        <div class="row g-4">
            <section class="col-lg-7">
                <div class="board-panel p-3 p-md-4 h-100">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h2 class="h4 mb-0">Partite disponibili</h2>
                        <span id="totalePartite" class="badge text-bg-dark">0</span>
                    </div>
                    <p class="text-muted small">Mostro solo partite con meno di 2 giocatori.</p>
                    <div id="partite" class="d-grid gap-3"></div>
                    <p id="vuoto" class="text-muted mb-0 hide">Nessuna partita libera. Crea tu la prossima sfida.</p>
                </div>
            </section>

            <section class="col-lg-5">
                <div class="board-panel p-3 p-md-4">
                    <h2 class="h4 mb-3">Crea partita</h2>
                    <form id="createForm" class="d-grid gap-3">
                        <div>
                            <label for="inputNome" class="form-label">Nome partita</label>
                            <input type="text" class="form-control" id="inputNome" placeholder="Es. Duello del Venerdi" required>
                        </div>
                        <div>
                            <label for="ownerPlayerName" class="form-label">Nome primo giocatore</label>
                            <input type="text" class="form-control" id="ownerPlayerName" placeholder="Es. Marco" required>
                        </div>
                        <div>
                            <label for="categorySelect" class="form-label">Categoria</label>
                            <select class="form-select" id="categorySelect" required>
                                <option value="simpson">Simpson</option>
                                <option value="persone">Persone</option>
                                <option value="griffin">Griffin</option>
                                <option value="animali">Animali</option>
                                <option value="macchine">Macchine</option>
                            </select>
                        </div>
                        <div>
                            <label class="form-label d-block">Tipo partita</label>
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="radio" name="privacy" id="publicGame" value="public" checked>
                                <label class="form-check-label" for="publicGame">Pubblica</label>
                            </div>
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="radio" name="privacy" id="privateGame" value="private">
                                <label class="form-check-label" for="privateGame">Privata</label>
                            </div>
                        </div>
                        <div id="passwordContainer" class="hide">
                            <label for="passwordInput" class="form-label">Password partita privata</label>
                            <input type="password" class="form-control" id="passwordInput" placeholder="Inserisci password">
                        </div>

                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-brand w-100">Crea</button>
                            <button type="reset" class="btn btn-outline-secondary w-100">Reset</button>
                        </div>
                    </form>
                </div>
            </section>
        </div>
    </main>

    <script>
        const API_KEY = "2a6b126a-b0e9-4af0-a164-55f023d4d99c7f310849919647d5952eecd649e731cc";
        const BASE_URL = "";
        const STORAGE_KEY = "guesswho_game_meta";
        const ACTIVE_SESSION_KEY = "guesswho_active_session";
        const EMPTY_GAME_DELETE_MS = 2 * 60 * 1000;
        const CATEGORIES = ["simpson", "persone", "griffin", "animali", "macchine"];

        const partiteEl = document.getElementById("partite");
        const totalePartiteEl = document.getElementById("totalePartite");
        const vuotoEl = document.getElementById("vuoto");
        const createForm = document.getElementById("createForm");
        const refreshBtn = document.getElementById("refreshBtn");
        const privateGameEl = document.getElementById("privateGame");
        const publicGameEl = document.getElementById("publicGame");
        const passwordContainer = document.getElementById("passwordContainer");
        const passwordInput = document.getElementById("passwordInput");
        const categorySelect = document.getElementById("categorySelect");

        function headers(isJson) {
            const h = new Headers();
            h.append("X-API-Key", API_KEY);
            if (isJson) {
                h.append("Content-Type", "application/json");
            }
            return h;
        }

        function readMeta() {
            try {
                return JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");
            } catch {
                return {};
            }
        }

        function saveMeta(meta) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(meta));
        }

        function togglePasswordInput() {
            const isPrivate = privateGameEl.checked;
            passwordContainer.classList.toggle("hide", !isPrivate);
            passwordInput.required = isPrivate;
            if (!isPrivate) {
                passwordInput.value = "";
            }
        }

        function normalizeCategory(category) {
            return CATEGORIES.includes(category) ? category : "persone";
        }

        function categoryLabel(category) {
            return normalizeCategory(category).charAt(0).toUpperCase() + normalizeCategory(category).slice(1);
        }

        async function getRemoteGameSettings(gameId) {
            try {
                const response = await fetch(`${BASE_URL}/games/${gameId}/moves`, {
                    method: "GET",
                    headers: headers(false),
                    redirect: "follow"
                });
                const result = await response.json();
                if (!response.ok) {
                    throw new Error(result.error || "Errore recupero privacy partita");
                }

                const privacyMoves = result.moves.filter((m) => m.data && m.data.type === "privacy");
                const categoryMoves = result.moves.filter((m) => m.data && m.data.type === "category");
                const latestPrivacy = privacyMoves.length > 0 ? privacyMoves[privacyMoves.length - 1].data : null;
                const latestCategory = categoryMoves.length > 0 ? categoryMoves[categoryMoves.length - 1].data : null;

                return {
                    isPrivate: Boolean(latestPrivacy && latestPrivacy.isPrivate),
                    password: latestPrivacy ? (latestPrivacy.password || "") : "",
                    category: normalizeCategory(latestCategory && latestCategory.value)
                };
            } catch {
                return null;
            }
        }

        async function publishPrivacySettings(gameId, playerId, metadata) {
            if (!metadata) {
                return;
            }

            await fetch(`${BASE_URL}/games/${gameId}/moves`, {
                method: "POST",
                headers: headers(true),
                body: JSON.stringify({
                    playerId,
                    data: {
                        type: "privacy",
                        isPrivate: Boolean(metadata.isPrivate),
                        password: metadata.isPrivate ? (metadata.password || "") : ""
                    }
                }),
                redirect: "follow"
            });
        }

        async function publishCategorySettings(gameId, playerId, metadata) {
            if (!metadata) {
                return;
            }

            await fetch(`${BASE_URL}/games/${gameId}/moves`, {
                method: "POST",
                headers: headers(true),
                body: JSON.stringify({
                    playerId,
                    data: {
                        type: "category",
                        value: normalizeCategory(metadata.category)
                    }
                }),
                redirect: "follow"
            });
        }

        async function fetchGames() {
            partiteEl.innerHTML = "";
            vuotoEl.classList.add("hide");

            try {
                const response = await fetch(`${BASE_URL}/games`, {
                    method: "GET",
                    headers: headers(false),
                    redirect: "follow"
                });

                const risultato = await response.json();
                if (!response.ok) {
                    throw new Error(risultato.error || "Errore nel recupero partite");
                }

                const meta = readMeta();
                const now = Date.now();
                const cleanedGames = [];

                for (const game of risultato.games) {
                    if (game.players.length === 0) {
                        const updatedAtMs = new Date(game.updatedAt || game.createdAt || now).getTime();
                        if (now - updatedAtMs >= EMPTY_GAME_DELETE_MS) {
                            try {
                                await fetch(`${BASE_URL}/games/${game.id}`, {
                                    method: "DELETE",
                                    headers: headers(false),
                                    redirect: "follow"
                                });
                                delete meta[game.id];
                            } catch (error) {
                                console.error(error);
                            }
                            continue;
                        }
                    }
                    cleanedGames.push(game);
                }

                saveMeta(meta);
                const disponibili = cleanedGames.filter((g) => g.players.length < 2);
                const remoteSettingsEntries = await Promise.all(
                    disponibili.map(async (g) => [g.id, await getRemoteGameSettings(g.id)])
                );
                const remoteSettingsMap = Object.fromEntries(remoteSettingsEntries);
                totalePartiteEl.innerText = String(disponibili.length);

                if (disponibili.length === 0) {
                    vuotoEl.classList.remove("hide");
                }

                disponibili.forEach((element) => {
                    const info = remoteSettingsMap[element.id] || meta[element.id] || {
                        isPrivate: false,
                        password: "",
                        category: "persone"
                    };
                    const game = document.createElement("button");
                    game.type = "button";
                    game.className = `game-item ${info.isPrivate ? "game-private" : "game-public"} p-3 text-start bg-white`;
                    game.innerHTML = `
                        <div class="d-flex justify-content-between align-items-center gap-2">
                            <strong>${element.name}</strong>
                            <span class="badge ${info.isPrivate ? "text-bg-danger" : "text-bg-success"}">${info.isPrivate ? "Privata" : "Pubblica"}</span>
                        </div>
                        <div class="mt-1 d-flex gap-2 align-items-center">
                            <small class="text-muted">Giocatori: ${element.players.length}/2</small>
                            <small class="text-muted">Categoria: ${categoryLabel(info.category)}</small>
                            <span class="chip">Entra</span>
                        </div>
                    `;
                    game.addEventListener("click", () => aggiungiGiocatore(element.id, element.name, info));
                    partiteEl.appendChild(game);
                });
            } catch (error) {
                console.error(error);
                alert(error.message);
            }
        }

        async function creaPartita(event) {
            event.preventDefault();
            const nomePartita = document.getElementById("inputNome").value.trim();
            const nomePrimoGiocatore = document.getElementById("ownerPlayerName").value.trim();
            const privata = privateGameEl.checked;
            const password = passwordInput.value.trim();
            const categoria = normalizeCategory(categorySelect.value);

            if (!nomePartita) {
                alert("Inserisci il nome della partita.");
                return;
            }

            if (!nomePrimoGiocatore) {
                alert("Inserisci il nome del primo giocatore.");
                return;
            }

            if (privata && password.length < 3) {
                alert("La password deve avere almeno 3 caratteri.");
                return;
            }

            if (!CATEGORIES.includes(categoria)) {
                alert("Categoria non valida.");
                return;
            }

            try {
                const createResponse = await fetch(`${BASE_URL}/games`, {
                    method: "POST",
                    headers: headers(true),
                    body: JSON.stringify({ name: nomePartita }),
                    redirect: "follow"
                });
                const createResult = await createResponse.json();

                if (!createResponse.ok) {
                    throw new Error(createResult.error || "Errore nella creazione partita");
                }

                const gameId = createResult.game.id;
                const meta = readMeta();
                meta[gameId] = {
                    isPrivate: privata,
                    password: privata ? password : "",
                    category: categoria,
                    createdAt: new Date().toISOString()
                };
                saveMeta(meta);

                await aggiungiGiocatore(gameId, nomePartita, meta[gameId], nomePrimoGiocatore);
                createForm.reset();
                togglePasswordInput();
                await fetchGames();
            } catch (error) {
                console.error(error);
                alert(error.message);
            }
        }

        async function aggiungiGiocatore(gameId, gameName, metadata, presetPlayerName) {
            if (metadata && metadata.isPrivate) {
                const pass = prompt(`Partita privata: inserisci password per ${gameName}`);
                if (pass === null) {
                    return;
                }
                if (pass !== metadata.password) {
                    alert("Password non corretta.");
                    return;
                }
            }

            const nomeGiocatore = (presetPlayerName || prompt(`Nome giocatore da aggiungere a ${gameName}:`) || "").trim();
            if (!nomeGiocatore) {
                return;
            }

            try {
                const checkResponse = await fetch(`${BASE_URL}/games/${gameId}/players`, {
                    method: "GET",
                    headers: headers(false),
                    redirect: "follow"
                });
                const checkResult = await checkResponse.json();
                if (!checkResponse.ok) {
                    throw new Error(checkResult.error || "Errore nel controllo giocatori");
                }
                if (checkResult.count >= 2) {
                    alert("Questa partita e' gia piena (max 2 giocatori).");
                    await fetchGames();
                    return;
                }
            } catch (error) {
                console.error(error);
                alert(error.message);
                return;
            }

            const requestOptions = {
                method: "POST",
                headers: headers(true),
                body: JSON.stringify({ name: nomeGiocatore }),
                redirect: "follow"
            };

            try {
                const response = await fetch(`${BASE_URL}/games/${gameId}/players`, requestOptions);
                const risultato = await response.json();

                if (!response.ok) {
                    throw new Error(risultato.error || "Errore durante l'aggiunta del giocatore");
                }

                if (presetPlayerName && metadata) {
                    await publishPrivacySettings(gameId, risultato.player.id, metadata);
                    await publishCategorySettings(gameId, risultato.player.id, metadata);
                }

                alert(`Giocatore aggiunto: ${risultato.player.name}`);
                sessionStorage.setItem(ACTIVE_SESSION_KEY, JSON.stringify({
                    gameId,
                    gameName,
                    gameCategory: normalizeCategory(metadata && metadata.category),
                    playerId: risultato.player.id,
                    playerName: risultato.player.name,
                    updatedAt: new Date().toISOString()
                }));
                const target = "splash.html";
                window.location.href = target;
            } catch (error) {
                console.error(error);
                alert(error.message);
            }
        }

        privateGameEl.addEventListener("change", togglePasswordInput);
        publicGameEl.addEventListener("change", togglePasswordInput);
        createForm.addEventListener("reset", () => {
            setTimeout(togglePasswordInput, 0);
        });
        createForm.addEventListener("submit", creaPartita);
        refreshBtn.addEventListener("click", fetchGames);

        togglePasswordInput();
        fetchGames();
        setInterval(fetchGames, 10000);
    </script>
</body>
</html>
